#
#	PostgreSQL queries for FreeRADIUS rlm_sql
#
#	Standard FreeRADIUS queries adapted for Supabase PostgreSQL.
#	These handle authorization lookups, accounting writes, and post-auth logging.
#

# Set SQL-User-Name attribute used in all queries below
sql_user_name = "%{User-Name}"

#
#	Authorization queries
#
authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_group_check_query = "\
	SELECT ${groupcheck_table}.id, ${groupcheck_table}.groupname, \
	${groupcheck_table}.attribute, ${groupcheck_table}.value, ${groupcheck_table}.op \
	FROM ${groupcheck_table}, ${usergroup_table} \
	WHERE ${usergroup_table}.username = '%{SQL-User-Name}' \
	AND ${usergroup_table}.groupname = ${groupcheck_table}.groupname \
	ORDER BY ${groupcheck_table}.id"

authorize_group_reply_query = "\
	SELECT ${groupreply_table}.id, ${groupreply_table}.groupname, \
	${groupreply_table}.attribute, ${groupreply_table}.value, ${groupreply_table}.op \
	FROM ${groupreply_table}, ${usergroup_table} \
	WHERE ${usergroup_table}.username = '%{SQL-User-Name}' \
	AND ${usergroup_table}.groupname = ${groupreply_table}.groupname \
	ORDER BY ${groupreply_table}.id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{SQL-User-Name}' \
	ORDER BY priority"

#
#	Simultaneous-Use checking
#
simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

simul_verify_query = "\
	SELECT radacctid, acctsessionid, username, nasipaddress, nasportid, \
	framedipaddress, callingstationid, framedprotocol \
	FROM ${acct_table1} \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL"

#
#	Accounting queries
#

accounting {

	reference = "%{tolower:type.%{Acct-Status-Type}.query}"

	type {
		start {
			query = "\
				INSERT INTO ${....acct_table1} \
					(acctsessionid, acctuniqueid, username, nasipaddress, \
					nasportid, nasporttype, acctstarttime, acctupdatetime, \
					acctstoptime, acctsessiontime, acctauthentic, \
					connectinfo_connect, acctinputoctets, acctoutputoctets, \
					calledstationid, callingstationid, acctterminatecause, \
					servicetype, framedprotocol, framedipaddress) \
				VALUES \
					('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
					'%{SQL-User-Name}', '%{NAS-IP-Address}', \
					'%{%{NAS-Port-ID}:-%{NAS-Port}}', '%{NAS-Port-Type}', \
					TO_TIMESTAMP(%{integer:Event-Timestamp}), \
					TO_TIMESTAMP(%{integer:Event-Timestamp}), \
					NULL, 0, '%{Acct-Authentic}', \
					'%{Connect-Info}', 0, 0, \
					'%{Called-Station-Id}', '%{Calling-Station-Id}', '', \
					'%{Service-Type}', '%{Framed-Protocol}', \
					'%{Framed-IP-Address}')"
		}

		interim-update {
			query = "\
				UPDATE ${....acct_table1} \
				SET acctupdatetime = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
					acctsessiontime = '%{Acct-Session-Time}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' * \
						1073741824 + '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' * \
						1073741824 + '%{%{Acct-Output-Octets}:-0}', \
					framedipaddress = '%{Framed-IP-Address}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
		}

		stop {
			query = "\
				UPDATE ${....acct_table1} \
				SET acctstoptime = TO_TIMESTAMP(%{integer:Event-Timestamp}), \
					acctsessiontime = '%{Acct-Session-Time}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' * \
						1073741824 + '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' * \
						1073741824 + '%{%{Acct-Output-Octets}:-0}', \
					acctterminatecause = '%{Acct-Terminate-Cause}', \
					connectinfo_stop = '%{Connect-Info}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
		}
	}
}

#
#	Post-auth queries
#
post-auth {
	query = "\
		INSERT INTO ${..postauth_table} \
			(username, pass, reply, authdate) \
		VALUES \
			('%{SQL-User-Name}', \
			'%{%{User-Password}:-%{Chap-Password}}', \
			'%{reply:Packet-Type}', now())"
}
