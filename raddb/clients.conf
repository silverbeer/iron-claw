#
#	RADIUS clients configuration for iron-claw
#
#	The iron-claw scraper authenticates from localhost.
#

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	nastype = other
	shortname = iron-claw
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
	nastype = other
	shortname = iron-claw-v6
}

# Docker bridge network (allows Mac host -> container via port mapping)
client docker_bridge {
	ipaddr = 172.16.0.0/12
	secret = testing123
	nastype = other
	shortname = iron-claw-docker
}
