[project]
name = "iron-claw"
version = "0.1.0"
description = "RADIUS-controlled LLM match scraper"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyrad>=2.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.40",
    "pydantic-ai>=0.1",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "rich>=13.0",
]

[project.scripts]
iron-claw = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "psycopg2-binary>=2.9",
    "beautifulsoup4>=4.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/llm", "src/models", "src/monitor", "src/policy", "src/mq", "src/proxy", "src/radius", "src/scraper", "src/utils"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live FreeRADIUS + Supabase (deselect with '-m not integration')",
]
