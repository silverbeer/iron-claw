[project]
name = "iron-claw"
version = "0.1.0"
description = "RADIUS-controlled LLM match scraper"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyrad>=2.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "structlog>=24.0",
]

[project.scripts]
iron-claw = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
