name: Docker Proxy Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.proxy"
      - "src/cli/**"
      - "src/proxy/**"
      - "src/policy/**"
      - "src/radius/**"
      - "src/utils/**"
      - "pyproject.toml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.proxy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/iron-claw-proxy:latest
            ghcr.io/${{ github.repository_owner }}/iron-claw-proxy:${{ github.sha }}
