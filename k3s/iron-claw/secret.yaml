apiVersion: v1
kind: Secret
metadata:
  name: iron-claw-secrets
  namespace: default
type: Opaque
stringData:
  # RADIUS credentials for the scraper user
  IRON_CLAW_USERNAME: "iron-claw-scraper"
  IRON_CLAW_PASSWORD: "<REPLACE_WITH_ACTUAL_PASSWORD>"
  # Anthropic API key for LLM calls
  ANTHROPIC_API_KEY: "<REPLACE_WITH_ACTUAL_KEY>"
