apiVersion: batch/v1
kind: CronJob
metadata:
  name: iron-claw
  namespace: default
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: iron-claw
              image: ghcr.io/silverbeer/iron-claw:latest
              command: ["iron-claw", "scrape", "--json-logs"]
              envFrom:
                - configMapRef:
                    name: iron-claw-config
                - secretRef:
                    name: iron-claw-secrets
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
